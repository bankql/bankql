name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - apps/azf-v1/**
      - packages/schema/**
      - package-lock.json
      - .github/workflows/deploy-azf.yml
  workflow_dispatch:

concurrency:
  group: deploy-azf
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build bundle and deploy Function App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=@bankql/schema

      - run: npm run bundle --workspace=@bankql/azf-v1

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: apps/azf-v1/deploy
