name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/schema/**
      - package-lock.json
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=@bankql/schema

      - run: npm run build --workspace=@bankql/web

      - name: Rename SPA shell and stage SWA config
        run: |
          mv apps/web/dist/client/_shell.html apps/web/dist/client/index.html
          cp apps/web/staticwebapp.config.json apps/web/dist/client/

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist/client
          skip_app_build: true
          skip_api_build: true
